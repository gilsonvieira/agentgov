[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentgov"
version = "0.1.0"
description = "A governance harness for agent tool calls: typed contracts, a transaction boundary, hard rails, an audited event log, and deterministic replay."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Gilson Vieira" }]
keywords = ["agent", "governance", "audit", "guardrails", "event-sourcing", "replay"]
dependencies = [
    "pydantic>=2.6",
    "structlog>=24.1",
]

[project.optional-dependencies]
viewer = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
]

[project.scripts]
agentgov-viewer = "agentgov_viewer.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentgov", "src/agentgov_viewer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
