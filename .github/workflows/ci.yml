name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev,viewer]"
      - name: Firewall (no model-vendor SDK in core)
        run: python -c "from agentgov.firewall import enforce; enforce()"
      - name: Tests
        run: pytest
